<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3454d1">
<meta name="description" content="DNA and protein analysis tools for bioinformatics students, with step-by-step animations.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sequence Toolkit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#16222f;--mute:#5d6b7b;--line:#d8dee6;--side:#0f1c2c;--sideink:#b9c6d6;--accent:#0e7490;--A:#1a7f4b;--T:#c2362f;--G:#a35f00;--C:#1f5fbf;--soft:#f6f8fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b131d;--panel:#122030;--ink:#e6edf5;--mute:#93a4b8;--line:#243649;--side:#08101a;--accent:#4cc3df;--A:#4ccf8a;--T:#ff7b72;--G:#f0b429;--C:#6ea8ff;--soft:#0f1b29}}
:root[data-theme="dark"]{--bg:#0b131d;--panel:#122030;--ink:#e6edf5;--mute:#93a4b8;--line:#243649;--side:#08101a;--accent:#4cc3df;--A:#4ccf8a;--T:#ff7b72;--G:#f0b429;--C:#6ea8ff;--soft:#0f1b29}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--side);color:#fff;padding:12px 20px;display:flex;align-items:baseline;gap:12px}
.top b{font-size:1.1rem;font-weight:600}.top span{color:var(--sideink);font-size:.88rem}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 48px)}
.side{background:var(--side);padding:14px 0 30px}
.side h3{margin:16px 20px 6px;font-size:.78rem;font-weight:600;color:#7c8da3;letter-spacing:.04em}
.side a{display:block;padding:8px 20px;color:var(--sideink);text-decoration:none;border-left:3px solid transparent}
.side a:hover{color:#fff}.side a.on{color:#fff;background:rgba(255,255,255,.07);border-left-color:var(--accent)}
main{padding:24px;min-width:0;max-width:980px;width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:18px}
.panel h2{margin:0 0 4px;font-size:1.15rem;font-weight:600}
.panel p.d{margin:0 0 12px;color:var(--mute);max-width:70ch}
.lab{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:var(--ink);font:14px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace}
button,.btn{font:inherit;font-size:.9rem;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px}
button:hover,.btn:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:.88rem;color:var(--mute);margin-left:4px}.msg.err{color:var(--T)}
.seq{font:14px/1.7 "IBM Plex Mono",ui-monospace,Menlo,monospace;word-break:break-all;overflow-wrap:anywhere;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:10px 12px;max-height:240px;overflow:auto}
.sec{margin:0 0 6px;font-weight:600;font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
.scroll{overflow-x:auto}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:.82rem;white-space:nowrap}
td.m{font-family:"IBM Plex Mono",ui-monospace,monospace}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.stats div{background:var(--panel);padding:10px 12px}.stats small{display:block;color:var(--mute);font-size:.78rem}.stats b{font:500 1.25rem "IBM Plex Mono",ui-monospace,monospace}
.comp{display:flex;height:12px;border-radius:2px;overflow:hidden;margin:6px 0 8px}
.comp i{display:block}.legend{display:flex;gap:16px;font:13px "IBM Plex Mono",ui-monospace,monospace;flex-wrap:wrap}
.A{color:var(--A)}.T{color:var(--T)}.G{color:var(--G)}.C{color:var(--C)}
.bgA{background:var(--A)}.bgT{background:var(--T)}.bgG{background:var(--G)}.bgC{background:var(--C)}
.note{color:var(--mute);font-size:.85rem;margin-top:10px;max-width:75ch}
.empty{color:var(--mute)}
details summary{cursor:pointer;color:var(--accent)}details .seq{margin-top:6px}
@media (max-width:780px){.app{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;padding:0;white-space:nowrap}.side h3{display:none}.side a{border-left:0;border-bottom:3px solid transparent;padding:11px 14px}.side a.on{border-bottom-color:var(--accent)}main{padding:14px}}
.dg{display:block;width:100%;height:auto;max-width:760px}.dg text{font:600 15px "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink)}.dg .lb{font:12px "IBM Plex Sans",system-ui,sans-serif;fill:var(--mute)}.dg .ln{stroke:var(--mute)}.dg .hl{fill:var(--soft);stroke:var(--T)}.dg .bx{fill:var(--soft);stroke:var(--line)}.dg .orfp{fill:var(--accent)}.dg .orfm{fill:var(--G)}.dg .cut{stroke:var(--T);stroke-width:2}.dg .gcl{fill:none;stroke:var(--accent);stroke-width:2}.dg .bar{fill:var(--accent)}.dg .A{fill:var(--A)}.dg .T{fill:var(--T)}.dg .G{fill:var(--G)}.dg .C{fill:var(--C)}
.how ol{margin:6px 0 10px;padding-left:20px}.how li{margin:5px 0}.how code{font:13px "IBM Plex Mono",ui-monospace,monospace;background:var(--soft);padding:1px 5px;border-radius:3px;word-break:break-all}pre.code{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow:auto;font:13px/1.5 "IBM Plex Mono",ui-monospace,monospace;margin:8px 0 0}
.dg .tile{fill-opacity:.16;stroke-width:1.5}.dg .tA{fill:var(--A);stroke:var(--A)}.dg .tT,.dg .tU{fill:var(--T);stroke:var(--T)}.dg .tG{fill:var(--G);stroke:var(--G)}.dg .tC{fill:var(--C);stroke:var(--C)}.dg .tN{fill:var(--mute);stroke:var(--mute)}.dg .U{fill:var(--T)}
.dg .cur{stroke-width:3.5;fill-opacity:.4}.dg .dim{opacity:.35}.dg .aa{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}.dg .win{fill:none;stroke:var(--accent);stroke-width:3}.dg .win.ok{stroke:var(--A)}.dg .okc{fill:var(--A)}.dg .cb{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.dg .cb.reg{fill:var(--accent);fill-opacity:.2;stroke:var(--accent)}.dg .cb.cur{stroke:var(--ink);stroke-width:3}.dg .big{font:700 20px "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink)}
.pcap{margin:8px 0 0;min-height:2.8em}.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.pctl input[type=range]{flex:1;min-width:110px}.pctl select{padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;font-size:.9rem}

:root{--bg:#f3f6fb;--accent:#3454d1;--line:#dbe3ee;--soft:#f6f8fc;--tA:#1f8a50;--tT:#cf3a33;--tG:#b86a00;--tC:#2c64c4}
body{font-size:16px}
.top{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line)}.top b{font-size:1.25rem}.top span{color:var(--mute)}
.side{background:var(--panel);border-right:1px solid var(--line);padding-top:10px}.side h3{color:var(--mute)}
.side a{color:var(--ink);border-radius:0}.side a:hover{background:var(--soft);color:var(--ink)}.side a.on{background:var(--soft);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
main{padding:28px}.panel{border-radius:12px;padding:20px 22px;box-shadow:0 1px 3px rgba(20,40,90,.07)}.panel h2{font-size:1.35rem}.panel p.d{font-size:1rem}
.dg .tile{fill-opacity:1;stroke:none}.dg .tA{fill:var(--tA)}.dg .tT,.dg .tU{fill:var(--tT)}.dg .tG{fill:var(--tG)}.dg .tC{fill:var(--tC)}.dg .tN{fill:var(--mute)}
.dg .tt{fill:#fff;font:700 18px "IBM Plex Mono",ui-monospace,monospace}
.dg .cur{stroke:var(--ink);stroke-width:4;fill-opacity:1}.dg .dim{opacity:.3}
.dg .lb{font-size:13px}.dg .big{font-size:26px}.dg .ab{font-size:18px}.dg .cd{font-size:13px}
.pl .dg{max-width:520px;margin:0 auto}
.pcap{font-size:1.05rem;line-height:1.5;min-height:3.4em}
.pctl button{padding:9px 15px;font-size:1rem}
.chips{display:flex;gap:8px 16px;flex-wrap:wrap;margin:12px 0 0;font-size:.88rem;color:var(--mute)}.chip{display:inline-flex;align-items:center;gap:6px}.chip i{width:14px;height:14px;border-radius:3px;display:inline-block}
.mx{width:auto}.mx td,.mx th{text-align:center;padding:5px 10px;font:13px "IBM Plex Mono",ui-monospace,monospace}.mx td.pth{background:var(--accent);color:#fff;border-radius:3px}.mx small{opacity:.7}
.inp{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:var(--ink);font:inherit;font-size:.9rem}
.aiout,.msg-user,.msg-assistant{white-space:pre-wrap;line-height:1.6}.aiout{margin-top:12px}
.chat{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:12px;min-height:160px;max-height:440px;overflow:auto}
.msg-user,.msg-assistant{padding:9px 13px;border-radius:12px;margin:8px 0;max-width:92%}.msg-user{background:var(--accent);color:#fff;margin-left:auto}.msg-assistant{background:var(--panel);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="top"><b>Sequence Toolkit</b><span>DNA and protein analysis</span></div>
<div class="app">
<aside class="side" id="side"></aside>
<main>
<div class="panel">
 <label class="lab" for="seq">DNA sequence (plain text or FASTA)</label>
 <textarea id="seq" spellcheck="false" placeholder="Paste a sequence, or upload a FASTA file"></textarea>
 <div class="bar"><button id="ex" type="button">Load example</button><button id="clr" type="button">Clear</button><button id="up" type="button">Upload FASTA</button><input id="file" type="file" accept=".fa,.fasta,.fna,.txt" hidden><span class="msg" id="msg" role="status"></span></div>
</div>
<div id="view"></div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const AA="FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG",IDX={T:0,C:1,A:2,G:3},COMP={A:'T',T:'A',G:'C',C:'G',N:'N'};
const MASS={G:57.0519,A:71.0788,S:87.0782,P:97.1167,V:99.1326,T:101.1051,C:103.1388,L:113.1594,I:113.1594,N:114.1038,D:115.0886,Q:128.1307,K:128.1741,E:129.1155,M:131.1926,H:137.1411,F:147.1766,R:156.1875,Y:163.176,W:186.2132};
const ENZ=[['EcoRI','GAATTC',1],['BamHI','GGATCC',1],['HindIII','AAGCTT',1],['XhoI','CTCGAG',1],['XbaI','TCTAGA',1],['NdeI','CATATG',2],['NotI','GCGGCCGC',2],['SmaI','CCCGGG',3],['EcoRV','GATATC',3],['KpnI','GGTACC',5],['SacI','GAGCTC',5],['PstI','CTGCAG',5]];
const GROUPS=[['DNA',[['overview','Overview'],['rc','Reverse complement'],['tx','Transcription']]],['Translation',[['tl','Six-frame translation'],['orf','ORF finder']]],['Alignment',[['align','Pairwise alignment']]],['Protein',[['prot','Protein properties']]],['Cloning',[['re','Restriction sites']]]];
const col=s=>s.replace(/[ACGT]/g,b=>'<span class="'+b+'">'+b+'</span>');
const rcOf=s=>[...s].reverse().map(b=>COMP[b]).join('');
const tr=(s,f=0)=>{let p='';for(let i=f;i+2<s.length;i+=3){const c=s.slice(i,i+3);p+=c.includes('N')?'X':AA[IDX[c[0]]*16+IDX[c[1]]*4+IDX[c[2]]]}return p};
let P='',cur='overview',S=null,CP={};
function parse(){const raw=$('seq').value,body=raw.split('\n').filter(l=>!l.trim().startsWith('>')).join('');
 const s=body.toUpperCase().replace(/[\s\d]/g,'').replace(/U/g,'T');const bad=[...new Set(s.replace(/[ACGTN]/g,'').split(''))];
 return {s,bad,hadU:/U/i.test(body)}}
function cnt(s){const c={A:0,T:0,G:0,C:0,N:0};for(const b of s)c[b]++;return c}
const copyBtn=(k,t)=>{CP[k]=t;return '<button type="button" data-copy="'+k+'">Copy</button>'};
const head=(t,d)=>'<h2>'+t+'</h2><p class="d">'+d+'</p>';
const panel=(h,b)=>'<div class="panel">'+h+b+'</div>';
function mw(p){let m=18.01524;for(const a of p)m+=MASS[a]||0;return m}
function orfs(s,min){const out=[],n=s.length;[['+',s],['-',rcOf(s)]].forEach(([st,q])=>{for(let f=0;f<3;f++){let a=-1;for(let i=f;i+2<n;i+=3){const c=q.slice(i,i+3),aa=c.includes('N')?'X':AA[IDX[c[0]]*16+IDX[c[1]]*4+IDX[c[2]]];
 if(a<0&&c==='ATG')a=i;else if(a>=0&&aa==='*'){const len=(i-a)/3;if(len>=min)out.push({st,f:f+1,a:st==='+'?a+1:n-i-2,b:st==='+'?i+3:n-a,len,p:tr(q.slice(a,i))});a=-1}}}});return out.sort((x,y)=>y.len-x.len)}
const V={
 overview(s){const c=cnt(s),n=s.length,gc=c.G+c.C,at=c.A+c.T;const tm=n<14?4*gc+2*at:64.9+41*(gc-16.4)/n;
  const pc=b=>(c[b]/n*100).toFixed(1);
  return panel(head('Overview','Basic composition and properties of your sequence.'),'<div class="stats"><div><small>Length</small><b>'+n+' bp</b></div><div><small>GC content</small><b>'+(gc/n*100).toFixed(2)+'%</b></div><div><small>AT content</small><b>'+(at/n*100).toFixed(2)+'%</b></div><div><small>Estimated Tm</small><b>'+tm.toFixed(1)+' \u00b0C</b></div></div><div class="sec">Base composition</div><div class="comp">'+['A','T','G','C'].map(b=>'<i class="bg'+b+'" style="width:'+(c[b]/n*100)+'%"></i>').join('')+'</div><div class="legend">'+['A','T','G','C'].map(b=>'<span class="'+b+'">'+b+' '+c[b]+' ('+pc(b)+'%)</span>').join('')+(c.N?'<span>N '+c.N+'</span>':'')+'</div><p class="note">Tm uses the Wallace rule below 14 bases and a GC-based formula above that. It is a rough estimate for a single oligo, not a lab-grade prediction.</p><div class="sec" style="margin-top:14px">Sequence</div><div class="seq">'+col(s)+'</div>')},
 rc(s){const r=rcOf(s),c=[...s].map(b=>COMP[b]).join('');return panel(head('Reverse complement','The opposite strand, read 5\u2032 to 3\u2032. Also shows the plain complement and the reverse.'),
  [['Reverse complement',r],['Complement',c],['Reverse',[...s].reverse().join('')]].map(([t,x],i)=>'<div class="bar" style="justify-content:space-between;margin:'+(i?'14':'0')+'px 0 6px"><span class="sec" style="margin:0">'+t+'</span>'+copyBtn('rc'+i,x)+'</div><div class="seq">'+col(x)+'</div>').join(''))},
 tx(s){const r=s.replace(/T/g,'U');return panel(head('Transcription','Coding-strand DNA to mRNA. Thymine (T) is replaced by uracil (U).'),'<div class="bar" style="justify-content:space-between;margin:0 0 6px"><span class="sec" style="margin:0">mRNA</span>'+copyBtn('tx',r)+'</div><div class="seq">'+col(s).replace(/<span class="T">T<\/span>/g,'<span class="T">U</span>')+'</div>')},
 tl(s){const rows=[['+',s],['-',rcOf(s)]].flatMap(([st,q])=>[0,1,2].map(f=>[st+(f+1),tr(q,f)]));
  return panel(head('Six-frame translation','All three reading frames on both strands. A * marks a stop codon, X an unknown codon.'),'<div class="scroll"><table><tr><th>Frame</th><th>Protein</th><th></th></tr>'+rows.map(([f,p],i)=>'<tr><td>'+f+'</td><td class="m" style="word-break:break-all">'+p+'</td><td>'+copyBtn('tl'+i,p)+'</td></tr>').join('')+'</table></div><p class="note">Frames 1 to 3 start at the first, second and third base of the forward strand. Frames - are read on the reverse complement.</p>')},
 orf(s){const min=+(CP._min||30);const o=orfs(s,min);return panel(head('ORF finder','Open reading frames that start with ATG and end with a stop codon, on both strands.'),
  '<div class="bar" style="margin:0 0 12px"><label for="min" class="lab" style="margin:0">Minimum length (amino acids)</label><input id="min" type="number" min="1" value="'+min+'" style="width:80px;padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:var(--ink)"></div>'+
  (o.length?'<div class="scroll"><table><tr><th>Strand</th><th>Frame</th><th>Start</th><th>End</th><th>Length (aa)</th><th>Protein</th></tr>'+o.slice(0,50).map(r=>'<tr><td>'+r.st+'</td><td>'+r.f+'</td><td>'+r.a+'</td><td>'+r.b+'</td><td>'+r.len+'</td><td><details><summary>View</summary><div class="seq">'+r.p+'</div></details></td></tr>').join('')+'</table></div>'+(o.length>50?'<p class="note">Showing the longest 50 of '+o.length+'.</p>':''):'<p class="empty">No ORFs of at least '+min+' amino acids found. Try a lower minimum.</p>'))},
 re(s){const rows=ENZ.map(([n,site,off])=>{const pos=[];let i=s.indexOf(site);while(i>=0){pos.push(i+off);i=s.indexOf(site,i+1)}return [n,site,pos]});
  return panel(head('Restriction sites','Common restriction enzymes and where they cut your sequence.'),'<div class="scroll"><table><tr><th>Enzyme</th><th>Site</th><th>Cuts</th><th>Cut positions</th></tr>'+rows.map(([n,site,pos])=>'<tr><td>'+n+'</td><td class="m">'+col(site)+'</td><td>'+pos.length+'</td><td class="m">'+(pos.length?pos.join(', '):'none')+'</td></tr>').join('')+'</table></div><p class="note">A cut position is the base after which the enzyme cuts the top strand, counted from 1. Only these 12 enzymes are checked.</p>')},
};
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const svg=(w,h,b,l)=>'<svg viewBox="0 0 '+w+' '+h+'" class="dg" '+(w>420?'style="min-width:560px" ':'')+'role="img" aria-label="'+l+'">'+b+'</svg>';
const tx_=(x,y,t,c,a)=>'<text x="'+x+'" y="'+y+'"'+(a?' text-anchor="'+a+'"':'')+(c?' class="'+c+'"':'')+'>'+t+'</text>';
const dgPair=s=>{const n=Math.min(s.length,20),w=26;let o=tx_(2,22,'5\u2032','lb')+tx_(2,122,'3\u2032','lb');
 for(let i=0;i<n;i++){const x=34+i*w+w/2,b=s[i],c=COMP[b];o+=tx_(x,22,b,b,'middle')+'<line x1="'+x+'" y1="32" x2="'+x+'" y2="98" class="ln" style="stroke-width:'+('GC'.includes(b)?3.5:1.5)+'"/>'+tx_(x,122,c,c,'middle')}
 return [svg(34+n*w+30,138,o+tx_(34+n*w+8,22,'3\u2032','lb')+tx_(34+n*w+8,122,'5\u2032','lb'),'Base pairing'),'First '+n+' bases. Top: your strand. Bottom: the complementary strand. A thick line is a G-C pair (3 hydrogen bonds), a thin line is an A-T pair (2). Read the bottom strand from right to left to get the reverse complement.']};
const dgTx=s=>{const n=Math.min(s.length,24),w=24;let o=tx_(2,28,'DNA','lb')+tx_(2,98,'mRNA','lb')+tx_(52+n*w/2,62,'\u2193 transcription (T becomes U)','lb','middle');
 for(let i=0;i<n;i++){const x=52+i*w+w/2,b=s[i];o+=tx_(x,28,b,b,'middle');if(b==='T')o+='<rect x="'+(x-10)+'" y="78" width="20" height="26" rx="3" class="hl"/>';o+=tx_(x,98,b==='T'?'U':b,b,'middle')}
 return [svg(60+n*w,116,o,'Transcription'),'First '+n+' bases. Every T in the DNA (boxed) becomes U in the mRNA. The other bases stay the same.']};
const dgTl=s=>{const n=Math.min(Math.floor(s.length/3),10),w=58;let o='';
 for(let i=0;i<n;i++){const c=s.slice(i*3,i*3+3),a=c.includes('N')?'X':AA[IDX[c[0]]*16+IDX[c[1]]*4+IDX[c[2]]],x=i*w+4,m=x+(w-8)/2;

CODE.align="H[i][j] = max(\n  H[i-1][j-1] + (a[i] === b[j] ? match : mismatch),  // diagonal\n  H[i-1][j]   + gap,                                 // up\n  H[i][j-1]   + gap                                  // left\n);\n// local mode: also max with 0\n// then trace back from the end (or the best cell) to the start";
const cleanDna=raw=>raw.split('\n').filter(l=>!l.trim().startsWith('>')).join('').toUpperCase().replace(/[\s\d]/g,'').replace(/U/g,'T');
function nw(a,b,loc,M,X,G){const n=a.length,m=b.length,H=[],T=[];
 for(let i=0;i<=n;i++){H.push(new Array(m+1).fill(0));T.push(new Array(m+1).fill(0))}
 if(!loc){for(let i=1;i<=n;i++){H[i][0]=i*G;T[i][0]=2}for(let j=1;j<=m;j++){H[0][j]=j*G;T[0][j]=3}}
 let bs=0,bi=0,bj=0;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const d=H[i-1][j-1]+(a[i-1]===b[j-1]?M:X),u=H[i-1][j]+G,l=H[i][j-1]+G;let v=Math.max(d,u,l),t=v===d?1:v===u?2:3;if(loc&&v<=0){v=0;t=0}H[i][j]=v;T[i][j]=t;if(v>bs){bs=v;bi=i;bj=j}}
 let i=loc?bi:n,j=loc?bj:m,A='',B='';const path=[[i,j]];
 while(loc?T[i][j]!==0:(i>0||j>0)){const t=T[i][j];if(t===1){A=a[i-1]+A;B=b[j-1]+B;i--;j--}else if(t===2){A=a[i-1]+A;B='-'+B;i--}else{A='-'+A;B=b[j-1]+B;j--}path.push([i,j])}
 return {H,A,B,path,score:loc?bs:H[n][m],si:i,sj:j}}
function heat(a,b,r){const on=new Set(r.path.map(p=>p.join()));let h='<table class="mx"><tr><th></th><th></th>'+[...b].map(c=>'<th class="'+c+'">'+c+'</th>').join('')+'</tr>';
 for(let i=0;i<=a.length;i++){h+='<tr><th class="'+(i?a[i-1]:'')+'">'+(i?a[i-1]:'')+'</th>';for(let j=0;j<=b.length;j++)h+='<td'+(on.has(i+','+j)?' class="pth"':'')+'>'+r.H[i][j]+'</td>';h+='</tr>'}
 return h+'</table>'}
function aResult(a,b,loc,M,X,G){const r=nw(a,b,loc,M,X,G),A=r.A,B=r.B,L=A.length;
 if(!L)return '<p class="empty">No matching region found with these scores.</p>';
 let mt=0,mm=0,gp=0,mid='',p1=r.si,p2=r.sj;const df=[];
 for(let k=0;k<L;k++){const x=A[k],y=B[k];if(x!=='-')p1++;if(y!=='-')p2++;
  if(x==='-'){gp++;mid+=' ';df.push(['Insertion in sequence 2','after '+p1,'-',y])}else if(y==='-'){gp++;mid+=' ';df.push(['Deletion in sequence 2',p1,x,'-'])}else if(x===y){mt++;mid+='|'}else{mm++;mid+='.';df.push(['Substitution',p1,x,y])}}
 let blk='',s1=r.si,s2=r.sj;
 for(let k=0;k<L;k+=50){const x=A.slice(k,k+50),y=B.slice(k,k+50),e1=s1+[...x].filter(c=>c!=='-').length,e2=s2+[...y].filter(c=>c!=='-').length;
  blk+='Seq 1  '+String(s1+1).padStart(4)+'  '+col(x)+'  '+e1+'\n       '+' '.repeat(4)+'  '+mid.slice(k,k+50)+'\n'+'Seq 2  '+String(s2+1).padStart(4)+'  '+col(y)+'  '+e2+'\n\n';s1=e1;s2=e2}
 return '<div class="stats"><div><small>Score</small><b>'+r.score+'</b></div><div><small>Identity</small><b>'+(mt/L*100).toFixed(1)+'%</b></div><div><small>Matches</small><b>'+mt+'</b></div><div><small>Mismatches</small><b>'+mm+'</b></div><div><small>Gaps</small><b>'+gp+'</b></div><div><small>Length</small><b>'+L+'</b></div></div>'+
 '<div class="sec">Alignment</div><div class="seq" style="white-space:pre;overflow-x:auto;max-height:none">'+blk+'</div><p class="note">| match, . mismatch, - gap.</p>'+
 '<div class="sec" style="margin-top:14px">Differences (possible mutations)</div>'+(df.length?'<div class="scroll"><table><tr><th>Type</th><th>Position in seq 1</th><th>Seq 1</th><th>Seq 2</th></tr>'+df.slice(0,40).map(d=>'<tr><td>'+d[0]+'</td><td>'+d[1]+'</td><td class="m">'+d[2]+'</td><td class="m">'+d[3]+'</td></tr>').join('')+'</table></div>'+(df.length>40?'<p class="note">Showing the first 40 of '+df.length+'.</p>':''):'<p class="empty">The aligned region is identical.</p>')+
 (a.length<=14&&b.length<=14?'<div class="sec" style="margin-top:16px">Score table (the highlighted path is the alignment)</div><div class="scroll">'+heat(a,b,r)+'</div>':'<p class="note">The score table is shown for sequences up to 14 bases.</p>')+
 howInner('align',['Make a table with your sequence down the side and the second sequence across the top.','Fill each cell with the best of three moves: diagonal (match '+M+' or mismatch '+X+'), up or left (gap '+G+').',loc?'Local mode: scores never go below 0, so the best matching part wins.':'Global mode: the alignment must cover both sequences from start to end.','Start at the '+(loc?'highest score':'bottom-right cell')+' and follow the best moves back to the start. That path is the alignment.','Compare the two aligned rows column by column to list substitutions, insertions and deletions.'])}
function alignRender(){
 $('view').innerHTML=panel(head('Pairwise alignment','Compare your sequence (top box) with a second sequence. It finds matches, mismatches (possible mutations) and gaps.'),
 '<label class="lab" for="s2">Second DNA sequence</label><textarea id="s2" spellcheck="false" placeholder="Paste the second sequence">'+S2+'</textarea><div class="bar" style="margin-top:12px"><label for="amode" class="lab" style="margin:0">Method</label><select id="amode" class="inp"><option value="global">Global</option><option value="local">Local</option></select><label for="am" class="lab" style="margin:0 0 0 8px">Match</label><input id="am" class="inp" type="number" style="width:64px"><label for="ax" class="lab" style="margin:0">Mismatch</label><input id="ax" class="inp" type="number" style="width:64px"><label for="ag" class="lab" style="margin:0">Gap</label><input id="ag" class="inp" type="number" style="width:64px"></div><div id="aout" style="margin-top:16px"></div>');
 $('amode').value=AM.mode;$('am').value=AM.M;$('ax').value=AM.X;$('ag').value=AM.G;
 const run=()=>{S2=$('s2').value;AM.mode=$('amode').value;const nv=(i,d)=>{const v=parseFloat($(i).value);return isNaN(v)?d:v};AM.M=nv('am',2);AM.X=nv('ax',-1);AM.G=nv('ag',-2);
  const b=cleanDna(S2),a=S.s,o=$('aout'),bad=[...new Set(b.replace(/[ACGTN]/g,'').split(''))];
  if(!b){o.innerHTML='<p class="empty">Enter a second sequence, or load the example.</p>';return}
  if(bad.length){o.innerHTML='<p class="msg err">Invalid characters in sequence 2: '+bad.join(', ')+'.</p>';return}
  if(a.length>300||b.length>300){o.innerHTML='<p class="msg err">Please use at most 300 bases per sequence for alignment.</p>';return}
  o.innerHTML=aResult(a,b,AM.mode==='local',AM.M,AM.X,AM.G)};
 ['s2','amode','am','ax','ag'].forEach(i=>$(i).oninput=run);
 $('amode').onchange=run;
 const ex=document.createElement('button');ex.type='button';ex.textContent='Load example';ex.onclick=()=>{$('s2').value=S.s.slice(0,40).replace(/G/,'A').replace(/C/,'')+S.s.slice(41,44);run()};$('amode').parentNode.prepend(ex);
 run()}
function charge(p,ph){const c={};for(const a of p)c[a]=(c[a]||0)+1;let q=1/(1+Math.pow(10,ph-9))-1/(1+Math.pow(10,2-ph));['K','R','H'].forEach(a=>q+=(c[a]||0)/(1+Math.pow(10,ph-PK[a])));['D','E','C','Y'].forEach(a=>q-=(c[a]||0)/(1+Math.pow(10,PK[a]-ph)));return q}
function pIof(p){let lo=0,hi=14;for(let i=0;i<40;i++){const m=(lo+hi)/2;if(charge(p,m)>0)lo=m;else hi=m}return(lo+hi)/2}
function protAdv(p){const w=9,gr=[...p].reduce((t,a)=>t+KD[a],0)/p.length,pts=[];
 for(let i=0;i+w<=p.length;i++){let t=0;for(let j=i;j<i+w;j++)t+=KD[p[j]];pts.push((40+(i+w/2)/p.length*640).toFixed(1)+','+(60-t/w*12).toFixed(1))}
 const plot=pts.length>1?'<div class="sec" style="margin:14px 0 6px">Hydropathy plot (Kyte-Doolittle, window 9)</div><div class="scroll">'+svg(700,124,'<line x1="40" y1="60" x2="680" y2="60" class="ln"/><line x1="40" y1="'+(60-1.6*12)+'" x2="680" y2="'+(60-1.6*12)+'" class="ln" style="stroke-dasharray:4 4"/>'+tx_(2,64,'0','lb')+tx_(2,44,'1.6','lb')+tx_(2,14,'+4','lb')+tx_(2,112,'-4','lb')+'<polyline points="'+pts.join(' ')+'" class="gcl"/>','Hydropathy plot')+'</div><p class="note">Peaks above the dashed line suggest hydrophobic stretches, which can be transmembrane regions. Valleys are hydrophilic and usually sit on the protein surface.</p>':'<p class="note">Enter at least 10 amino acids to see the hydropathy plot.</p>';
 return '<div class="sec" style="margin:16px 0 6px">Advanced properties</div><div class="stats"><div><small>GRAVY (hydropathy)</small><b>'+gr.toFixed(2)+'</b></div><div><small>Estimated pI</small><b>'+pIof(p).toFixed(2)+'</b></div><div><small>Charge at pH 7</small><b>'+charge(p,7).toFixed(1)+'</b></div></div><p class="note">A positive GRAVY means the protein is overall hydrophobic, a negative one means hydrophilic. pI and charge are estimates from standard pKa values.</p>'+plot}
function dinuc(s){const B=['A','T','G','C'],c={};B.forEach(a=>B.forEach(b=>c[a+b]=0));for(let i=0;i<s.length-1;i++){const k=s[i]+s[i+1];if(k in c)c[k]++}const mx=Math.max(1,...Object.values(c)),tot=Math.max(1,s.length-1);
 return panel('<div class="sec">Dinucleotide frequency</div>','<div class="scroll"><table class="mx"><tr><th>1st / 2nd</th>'+B.map(b=>'<th class="'+b+'">'+b+'</th>').join('')+'</tr>'+B.map(a=>'<tr><th class="'+a+'">'+a+'</th>'+B.map(b=>'<td style="background:rgba(52,84,209,'+(c[a+b]/mx*.45).toFixed(2)+')">'+c[a+b]+' <small>('+(c[a+b]/tot*100).toFixed(1)+'%)</small></td>').join('')+'</tr>').join('')+'</table></div><p class="note">How often each pair of neighbouring bases occurs. Darker means more frequent.</p>')}
let SM,CHAT=[],ACTL=null,AIL='English';
const getSample=async()=>{if(SM===undefined){try{SM=window.claude?await window.claude.use('sample'):null}catch(e){SM=null}}return SM};
const langTxt=l=>l==='Roman Urdu'?'Roman Urdu (Urdu written in English letters), keeping technical terms in English':'simple English';
const aiErr=c=>({not_granted:'AI was not allowed. Please allow it when asked, then try again.',rate_limited:'Too many requests. Wait a moment and try again.',cancelled:'(stopped)'}[c]||'Something went wrong. Please try again.');
function aiCtx(id,s){const n=s.length,c=cnt(s),gc=c.G+c.C,nm=(GROUPS.flatMap(g=>g[1]).find(x=>x[0]===id)||[0,id])[1];
 let r='Tool: '+nm+'\nSequence length: '+n+'\nBase counts: A='+c.A+' T='+c.T+' G='+c.G+' C='+c.C+'\nGC content: '+(gc/n*100).toFixed(2)+'%\nSequence'+(n>400?' (first 400 bases)':'')+': '+s.slice(0,400);
 if(id==='tl')r+='\nFrame 1 protein: '+tr(s,0).slice(0,150);
 if(id==='orf')r+='\nORFs (min '+(CP._min||30)+' aa): '+(orfs(s,+(CP._min||30)).slice(0,8).map(o=>o.st+' frame '+o.f+', '+o.a+'-'+o.b+', '+o.len+' aa').join('; ')||'none');
 if(id==='re')r+='\nCut sites: '+(ENZ.map(([m,site,off])=>{const p=[];let i=s.indexOf(site);while(i>=0){p.push(i+off);i=s.indexOf(site,i+1)}return p.length?m+' at '+p.join(','):null}).filter(Boolean).join('; ')||'none');
 return r}
const aiPanel=()=>'';const aiPanelClaudeOnly=()=>panel('<div class="sec">Explain with AI</div>','<p class="note" style="margin:0 0 10px">Get a short explanation of this result written for students.</p><div class="bar" style="margin:0"><select id="ailang" class="inp" aria-label="Language"><option'+(AIL==='English'?' selected':'')+'>English</option><option'+(AIL!=='English'?' selected':'')+'>Roman Urdu</option></select><button type="button" class="pri" id="aibtn">Explain this result</button><button type="button" id="aistop" hidden>Stop</button></div><div id="aiout" class="aiout" aria-live="polite"></div><p class="note">AI can make mistakes. The numbers above are calculated by code. Check important facts with your teacher or textbook.</p>');
async function askAI(){const out=$('aiout'),btn=$('aibtn'),stop=$('aistop');AIL=$('ailang').value;const sm=await getSample();

const chatHtml=()=>CHAT.length?CHAT.map(m=>'<div class="msg-'+m.role+'">'+esc(m.content)+'</div>').join(''):'<p class="empty">Ask anything about DNA, proteins or the tools in this app. For example:</p><div class="bar">'+['What is GC content?','Why do ORFs start with ATG?','What does a restriction enzyme do?'].map(q=>'<button type="button" data-q="'+q+'">'+q+'</button>').join('')+'</div>';
